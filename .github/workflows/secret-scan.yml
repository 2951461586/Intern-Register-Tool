name: secret-scan

# 泄漏闸门的**服务端**兜底。
#
# 🔴 为什么本地钩子不够：`.git/hooks/pre-commit` 可以被 `git commit --no-verify`
#    一行绕过，而且它**不随仓库分发**（新 clone 默认没有）。CI 不能绕。
#
# 🔴 这个 job 会**故意跑一遍闸门的自检**（变异验证）。因为"CI 里跑了扫描"不等于
#    "扫描真的会拦" —— 一个 `exit 0` 的死脚本也能让扫描步骤变绿。
#    自检会造含假凭据的仓库并断言闸门非 0 退出，这才证明它有效。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 必须取全历史。默认 fetch-depth=1 时 `--history` 只能看到 1 个提交，
          #    等于把"历史里躺着凭据"这条通道整个漏掉 —— 而那正是两次事故的形态。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 闸门自检（变异验证：证明它真的会拦）
        run: python tools/gates/selftest_check_leaks.py

      - name: 全量扫描（工作区 + 全部 git 历史）
        run: python tools/gates/check_leaks.py --all --history
