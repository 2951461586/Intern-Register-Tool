[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intern-register-tool"
version = "0.1.0"
description = "OpenXLab 注册 + API Key 提取（协议 + 浏览器混合链路）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31",
    "cryptography>=42.0",
    "playwright>=1.40",
]

# 开发依赖与运行依赖分开 —— CI 的 secret-scan job 只装运行依赖（甚至不装），
# 它必须能在没有 pytest 的环境里跑（见 .github/workflows/）。
#
# 🔴 ruff 锁到次版本：它会随次版本**新增规则**，不锁的话某天 CI 会因为
#    "上游发新版"而红，跟当次改动毫无关系（且这种红很容易被当成噪声忽略）。
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16,<0.17",
]

# ⚠ 包名就叫 `src`，是个很泛的名字。之所以不改：全库有 20+ 处
#    `from src.xxx import`，改名是纯 churn、且会让 git blame 失去意义。
#    本项目**不要求** `pip install -e .` —— 测试靠 pytest 的 `pythonpath`，
#    工具靠 `tools/_bootstrap.py`。这条配置只是让"想装的人装得上"。
#
# 🔴 `packages` 是**显式列表**，不会自动发现子包。
#    2026-09-19 阶段 B 把 `browser_login.py` 拆成 `src/browser/` 之后，
#    漏加这一项就会让构建出来的 wheel **缺整个子包**，而且不报错。
[tool.setuptools]
packages = ["src", "src.browser"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# 🔴 `pythonpath = ["."]` 让 tests/ 里能直接 `from src import ...`，
#    不需要在每个测试文件顶部写 sys.path.insert。
#    需要 pytest >= 7.0（`pythonpath` 内建支持）。
pythonpath = ["."]
# 🔴 `-rs` 让"跳过的用例"把**原因**打出来。
#    本项目有一类用例只在本地有真实台账（`results.json`）时才跑，
#    CI 上必然跳过（见 tests/conftest.py）。不加 `-rs` 的话 CI 日志里
#    只会多几个 `s`，看的人没法判断"是环境缺数据"还是"有人偷偷把测试禁了"。
addopts = "-q --strict-markers -rs"


[tool.ruff]
line-length = 100
target-version = "py311"
# 只扫源码与工具；测试与临时目录另行处理
extend-exclude = [".workbuddy-ai", "__pycache__"]

[tool.ruff.lint]
# 保守起步：只开"几乎不会误报"的规则族。
# 🔴 刻意**不**开 D（docstring）、ANN（标注）、C90（复杂度）——
#    本项目的注释密度和函数长度是有意为之（见各模块 docstring），
#    用它们刷出来的告警只会被 `# noqa` 淹没，最后连真问题一起被忽略。
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # E501 行宽：本项目的注释里大量是中文长句 + 实测数据表，
    # 折行会把可读性弄得更差。line-length 仍设为 100，用于 E 族的其它规则。
    "E501",
    # B008 函数调用作默认值：本项目用它做"可注入的默认实现"（如 log=print），
    # 是有意设计，不是疏漏。
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# tools/ 下的脚本有**结构性**的 E402，不是疏漏：
#   1. `from _path import ROOT` / `from _bootstrap import ROOT` 必须排在
#      `from src ...` 之前（副作用导入：把仓库根加进 sys.path）
#   2. `sys.stdout = io.TextIOWrapper(...)` 要尽早执行，否则中文/emoji 打不出来
# 两条都要求"import 中间夹可执行语句"。逐行 `# noqa` 会随新脚本不断增殖。
# ⚠ 用 `**` 而不是 `*` —— 2026-09-19 起脚本分在 tools/ 的 5 个子目录里。
"tools/**/*.py" = ["E402"]
# 闸门自检**故意**用运行时拼接构造假凭据（避免被自己拦下），
# 里面有一些"看起来像未使用变量"的中间量。
"tools/gates/selftest_check_leaks.py" = ["F841"]
# `_bootstrap` / `_path` 的存在意义就是 import 副作用。
"tools/_bootstrap.py" = ["F401"]
"tools/**/_path.py" = ["F401"]
